name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Test (short)
        run: go test -short -v -race -timeout 30s ./...

      - name: Test (full, no live API)
        run: go test -v -race -timeout 120s ./... -run '^Test[^_]'

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          if [ "$(gofmt -l . | wc -l)" -ne 0 ]; then
            echo "Code is not properly formatted:"
            gofmt -l .
            exit 1
          fi
